[pytest]
# Set default loop scope to silence pytest-asyncio deprecation
asyncio_default_fixture_loop_scope = function

# Filter known noisy deprecation warnings from FastAPI/Starlette and pytest-asyncio
filterwarnings =
    ignore:.*iscoroutinefunction.*:DeprecationWarning
    ignore:.*asyncio_default_fixture_loop_scope.*:pytest.PytestDeprecationWarning
